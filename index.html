<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앙앙 카페</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <nav>
      <span class="logo">☕ 앙앙 카페</span>
      <ul>
        <li><a href="#menu">메뉴</a></li>
        <li><a href="#about">소개</a></li>
        <li><a href="#visit">오시는 길</a></li>
      </ul>
    </nav>
    <div class="hero-text">
      <h1>하루의 쉼표, 앙앙 카페</h1>
      <p>직접 로스팅한 원두와 갓 구운 디저트를 만나보세요.</p>
      <a class="btn" href="#menu">메뉴 보기</a>
    </div>
  </header>

  <section id="menu">
    <h2>대표 메뉴</h2>
    <div class="cards">
      <div class="card"><h3>아메리카노</h3><p>깊고 깔끔한 맛</p><span>4,000원</span></div>
      <div class="card"><h3>카페라떼</h3><p>부드러운 우유 거품</p><span>4,500원</span></div>
      <div class="card"><h3>크로아상</h3><p>매일 아침 구운 버터 풍미</p><span>3,500원</span></div>
    </div>
  </section>

  <section id="about" class="alt">
    <h2>카페 소개</h2>
    <p>앙앙 카페는 편안한 분위기에서 좋은 커피 한 잔을 즐길 수 있도록 만든 작은 동네 카페예요.</p>
  </section>

  <section id="visit">
    <h2>오시는 길</h2>
    <p>서울시 어딘가 123 · 매일 09:00 – 21:00</p>
  </section>

  <footer>© 2026 앙앙 카페</footer>
</body>
</html>
